services:
  - type: web
    name: food-waste-donation-platform
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:application
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_DEBUG
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: MONGODB_DB
        value: food_donation_platform
      - key: APP_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
