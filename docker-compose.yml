version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_SECRET_KEY: "change-this-in-production"
      COOKIE_SECURE: "0"
      FLASK_DEBUG: "0"
      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DB: "food_donation_platform"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
